<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="280" viewBox="0 0 240 280" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Heart / arch shaped outline used by the medallion -->
    <path id="arch" d="M0,-62 C18,-48 40,-28 40,0 C40,30 20,50 0,60 C-20,50 -40,30 -40,0 C-40,-28 -18,-48 0,-62Z"/>

    <!-- Medallion centred on 0,0 -->
    <g id="medallion" fill="none" stroke="#b9b8b0" stroke-linecap="round" stroke-linejoin="round">
      <!-- outer dotted line -->
      <use xlink:href="#arch" stroke-width="3.2" stroke-dasharray="0.1 5.2" transform="scale(1.12)"/>
      <!-- solid ring -->
      <use xlink:href="#arch" stroke-width="1.6"/>
      <!-- filled inner shape with dotted white line -->
      <use xlink:href="#arch" fill="#b9b8b0" stroke="none" transform="scale(0.78)"/>
      <use xlink:href="#arch" stroke="#ffffff" stroke-width="2.4" stroke-dasharray="0.1 4.2" transform="scale(0.62)"/>
      <!-- radiating petals at the top -->
      <g stroke-width="1.6">
        <path d="M0,-34 C-5,-26 -5,-20 0,-14 C5,-20 5,-26 0,-34Z" stroke="#ffffff"/>
        <path d="M-12,-26 C-18,-20 -18,-12 -12,-8" stroke="#ffffff"/>
        <path d="M12,-26 C18,-20 18,-12 12,-8" stroke="#ffffff"/>
      </g>
      <!-- centre flower -->
      <circle cx="0" cy="4" r="12" fill="#ffffff" stroke="none"/>
      <circle cx="0" cy="4" r="12" stroke="#b9b8b0" stroke-width="1.4"/>
      <circle cx="0" cy="4" r="7" fill="#b9b8b0" stroke="none"/>
      <circle cx="0" cy="4" r="2.6" fill="#ffffff" stroke="none"/>
      <g fill="#b9b8b0" stroke="none">
        <circle cx="0" cy="-12" r="1.8"/>
        <circle cx="0" cy="20" r="1.8"/>
        <circle cx="-16" cy="4" r="1.8"/>
        <circle cx="16" cy="4" r="1.8"/>
      </g>
      <!-- bottom leaves -->
      <path d="M0,36 C-8,40 -12,34 -10,28" stroke="#ffffff" stroke-width="1.6"/>
      <path d="M0,36 C8,40 12,34 10,28" stroke="#ffffff" stroke-width="1.6"/>
    </g>

    <!-- Single curling scroll -->
    <g id="scroll" fill="none" stroke="#b9b8b0" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2,0 C16,-2 28,-10 28,-22 C28,-33 14,-35 11,-26 C9,-19 17,-16 20,-22" stroke-width="3"/>
      <path d="M2,6 C20,6 36,-4 38,-20 C40,-34 28,-44 16,-42" stroke-width="1.6"/>
      <circle cx="14" cy="-42" r="2.6" fill="#b9b8b0" stroke="none"/>
      <circle cx="30" cy="-6" r="1.8" fill="#b9b8b0" stroke="none"/>
      <circle cx="40" cy="-30" r="1.8" fill="#b9b8b0" stroke="none"/>
    </g>

    <!-- Mirrored pair of scrolls with a small diamond between -->
    <g id="pair">
      <use xlink:href="#scroll"/>
      <use xlink:href="#scroll" transform="scale(-1,1)"/>
      <path d="M0,-6 L5,0 L0,6 L-5,0Z" fill="#b9b8b0"/>
      <circle cx="0" cy="-14" r="2" fill="#b9b8b0"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="240" height="280" fill="#ffffff"/>

  <!-- medallions: centre + four corners (wrap around so the tile repeats seamlessly) -->
  <use xlink:href="#medallion" x="120" y="140"/>
  <use xlink:href="#medallion" x="0" y="0"/>
  <use xlink:href="#medallion" x="240" y="0"/>
  <use xlink:href="#medallion" x="0" y="280"/>
  <use xlink:href="#medallion" x="240" y="280"/>

  <!-- scroll pairs: top/bottom centre (point down / up) and left/right middle -->
  <use xlink:href="#pair" x="120" y="34"/>
  <use xlink:href="#pair" x="120" y="246" transform="rotate(180 120 246)"/>
  <g transform="translate(0,140) rotate(90)"><use xlink:href="#pair"/></g>
  <g transform="translate(240,140) rotate(-90)"><use xlink:href="#pair"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
